<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Candidate Registration | DevRecruit AI
    </title>

    <!-- Global CSS -->

    <link rel="stylesheet"
          href="../../../../styles/global.css">

    <!-- Register CSS -->

    <link rel="stylesheet"
          href="register.css">

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

    <!-- ==============================
         CANDIDATE REGISTER PAGE
    =============================== -->

    <main class="candidate-register-page">


        <!-- Background -->

        <div class="register-background">

            <div class="register-blob register-blob-one"></div>

            <div class="register-blob register-blob-two"></div>

            <div class="register-blob register-blob-three"></div>

        </div>


        <!-- Main Container -->

        <div class="register-container">


            <!-- Brand -->

            <a href="../../landing/index.html"
               class="register-brand">

                <span class="register-brand-icon">
                    🚀
                </span>

                <span>
                    DevRecruit AI
                </span>

            </a>


            <!-- Register Card -->

            <div class="register-card">


                <!-- Header -->

                <div class="register-header">

                    <div class="register-icon">

                        <i class="fa-solid fa-user-plus"></i>

                    </div>

                    <span class="register-role">
                        CANDIDATE PORTAL
                    </span>

                    <h1>
                        Create Your Account
                    </h1>

                    <p>
                        Start your developer journey with
                        AI-powered recruitment.
                    </p>

                </div>


                <!-- Form -->

                <form
                    id="candidateRegisterForm"
                    class="register-form"
                >


                    <!-- Name Row -->

                    <div class="form-row">


                        <!-- First Name -->

                        <div class="form-group">

                            <label for="firstName">
                                First Name
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-user"></i>

                                <input
                                    type="text"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="First name"
                                    autocomplete="given-name"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Last Name -->

                        <div class="form-group">

                            <label for="lastName">
                                Last Name
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-user"></i>

                                <input
                                    type="text"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Last name"
                                    autocomplete="family-name"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="registerEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter your phone number"
                                autocomplete="tel"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password Row -->

                    <div class="form-row">


                        <!-- Password -->

                        <div class="form-group">

                            <label for="registerPassword">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="registerPassword"
                                    name="password"
                                    placeholder="Create password"
                                    autocomplete="new-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    aria-label="Show password"
                                >

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>


                        <!-- Confirm Password -->

                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Confirm password"
                                    autocomplete="new-password"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- Terms -->

                    <label class="terms-checkbox">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>

                            I agree to the
                            <a href="#">
                                Terms of Service
                            </a>
                            and
                            <a href="#">
                                Privacy Policy
                            </a>

                        </span>

                    </label>


                    <!-- Register Button -->

                    <button
                        type="submit"
                        class="register-button"
                    >

                        <span>
                            Create Candidate Account
                        </span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                    <!-- Message -->

                    <p
                        id="registerMessage"
                        class="register-message"
                    ></p>

                </form>


                <!-- Login Link -->

                <div class="login-link">

                    <span>
                        Already have an account?
                    </span>

                    <a href="../login/index.html">
                        Sign In
                    </a>

                </div>


                <!-- Other Roles -->

                <div class="other-role">

                    <span>
                        Want another role?
                    </span>

                    <a href="../../auth/role-selection/index.html">
                        Choose another role
                    </a>

                </div>

            </div>


            <!-- Security -->

            <div class="register-security">

                <i class="fa-solid fa-shield-halved"></i>

                Secure candidate registration

            </div>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="register.js"></script>

</body>

</html>
